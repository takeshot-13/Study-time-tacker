<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Set the theme before any CSS paints, so there's no flash of the
  // wrong theme. Mode is 'light' | 'dark' | 'system' (default 'system').
  // The full toggle logic and the live system-change listener live in
  // theme.js, loaded later.
  (function () {
    try {
      var mode = localStorage.getItem('stt-theme-mode') || 'system';
      var resolved = mode === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) { /* localStorage unavailable — default light theme applies */ }
  })();
</script>
<title>Dashboard — Study Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html{ overflow-x:hidden; }

  .dash-shell{
    max-width:900px;
    margin:0 auto;
    padding:44px 24px 60px;
  }

  /* ---------- Gate / loading states ---------- */
  .gate-message{
    max-width:420px;
    margin:80px auto;
    text-align:center;
    padding:36px 28px;
    background:var(--surface-2);
    border:1px solid var(--hair);
    border-radius:16px;
  }
  .gate-message h2{
    font-family:'Poppins', sans-serif;
    font-size:18px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .gate-message p{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 18px;
  }

  /* ---------- Welcome header ---------- */
  .dash-welcome{
    margin-bottom:36px;
  }
  .dash-welcome h1{
    font-family:'Poppins', sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 6px;
  }
  .dash-welcome p{
    font-size:14px;
    color:var(--muted);
    margin:0;
  }

  /* ---------- Section shell ---------- */
  .dash-section{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:26px 26px 24px;
    margin-bottom:26px;
  }
  .dash-section h2{
    font-family:'Poppins', sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .dash-section .section-note{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 18px;
  }

  /* ---------- Calendar card ---------- */
  .calendar-card h2{
    font-family:'Poppins', sans-serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 4px;
  }
  .calendar-card .section-note{
    margin-bottom:22px;
  }

  /* ---------- Calendar month nav ---------- */
  .cal-month-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .cal-nav-btn{
    width:38px; height:38px;
    border-radius:50%;
    border:none;
    background:var(--active-bg);
    color:var(--forest);
    cursor:pointer;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, transform .1s ease;
  }
  .cal-nav-btn:hover{ background:var(--hover-bg); transform:scale(1.05); }
  .cal-month-label{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:17px;
    color:var(--ink);
  }

  /* ---------- Calendar grid ---------- */
  .cal-weekdays, .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:8px;
  }
  .cal-weekdays{
    margin-bottom:10px;
  }
  .cal-weekdays span{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-align:center;
  }
  .cal-day{
    all:unset;
    box-sizing:border-box;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-radius:50%;
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:#F3C4BB;
    color:#9A3B2B;
    transition:transform .1s ease;
  }
  .cal-day:hover{ transform:scale(1.06); }
  .cal-day:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .cal-day.marked{
    background:#B7CBA6;
    color:#4C6B3A;
  }
  .cal-day.empty{
    background:transparent;
    cursor:default;
  }
  .cal-day.empty:hover{ transform:none; }
  .cal-day.today::after{
    content:'';
    position:absolute;
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
    width:4px; height:4px;
    border-radius:50%;
    background:currentColor;
  }

  .cal-legend{
    display:flex;
    gap:16px;
    margin-top:20px;
    font-size:11.5px;
    color:var(--muted);
  }
  .cal-legend span{ display:flex; align-items:center; gap:6px; }
  .cal-legend .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .cal-legend .dot.red{ background:#F3C4BB; }
  .cal-legend .dot.green{ background:#B7CBA6; }

  @media (max-width:700px){
    .dash-shell{ padding:28px 16px 40px; }
    .dash-welcome h1{ font-size:21px; }
    .dash-section{ padding:20px 18px 18px; }
    .calendar-card h2{ font-size:20px; }
    .cal-nav-btn{ width:34px; height:34px; }
    .cal-day{ font-size:12.5px; }
    .cal-weekdays span{ font-size:10.5px; }
  }
</style>
</head>
<body>

    <div class="nav-user-chip" id="navUserChip">

</header>

  <nav class="side-drawer-nav">

        <span>Auto</span>

<main class="dash-shell" id="dashShell">
  <!-- Populated by JS below: either a sign-in prompt, or the dashboard itself. -->
  <div class="gate-message" id="gateMessage">
    <h2>Checking your sign-in status…</h2>
    <p>One moment.</p>
  </div>
</main>

<footer class="site-footer">© Study Time Tracker</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script>
(function(){
  const dashShell = document.getElementById('dashShell');
  const gateMessage = document.getElementById('gateMessage');

  const WEEKDAY_LETTERS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let marksByDate = {}; // 'YYYY-MM-DD' -> true/false, for the currently viewed month

  function pad(n){ return String(n).padStart(2, '0'); }
  function dateStr(y, m, d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }

  function showGate(title, note, showSignIn){
    gateMessage.innerHTML = `
      <h2>${title}</h2>
      <p>${note}</p>
      ${showSignIn ? '<button class="nav-signin-btn" id="gateSignIn" style="margin:0 auto;">Sign in with Google</button>' : ''}
    `;
    gateMessage.style.display = '';
    if(showSignIn){
      document.getElementById('gateSignIn').addEventListener('click', () => window.STTAuth.signInWithGoogle());
    }
  }

  function renderDashboard(session){
    const user = session.user;
    const meta = user.user_metadata || {};
    const name = (meta.full_name || meta.name || user.email || 'there').split(' ')[0];

    dashShell.innerHTML = `
      <div class="dash-welcome">
        <h1>Welcome back, ${name}</h1>
        <p>Here's your study activity.</p>
      </div>

      <section class="dash-section calendar-card">
        <h2>Calendar</h2>
        <p class="section-note">Tap a day to mark it studied — green means done, red means not yet.</p>
        <div class="cal-month-bar">
          <button class="cal-nav-btn" id="calPrev" aria-label="Previous month">‹</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="cal-nav-btn" id="calNext" aria-label="Next month">›</button>
        </div>
        <div class="cal-weekdays">${WEEKDAY_LETTERS.map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><span class="dot green"></span>Marked</span>
          <span><span class="dot red"></span>Not marked yet</span>
        </div>
      </section>
    `;

    const calGrid = document.getElementById('calGrid');
    const calMonthLabel = document.getElementById('calMonthLabel');

    async function loadMonth(){
      calGrid.innerHTML = '<p style="grid-column:1/-1;color:var(--muted);font-size:13px;">Loading…</p>';
      calMonthLabel.textContent = MONTH_NAMES[viewMonth] + ' ' + viewYear;

      marksByDate = {};
      if(window.STTAuth.client){
        const first = dateStr(viewYear, viewMonth, 1);
        const last = dateStr(viewYear, viewMonth, daysInMonth(viewYear, viewMonth));
        const { data, error } = await window.STTAuth.client
          .from('calendar_marks')
          .select('mark_date, marked')
          .eq('user_id', user.id)
          .gte('mark_date', first)
          .lte('mark_date', last);
        if(error){
          console.error('Failed to load calendar marks', error);
        } else {
          (data || []).forEach(row => { marksByDate[row.mark_date] = row.marked; });
        }
      }
      renderGrid();
    }

    function renderGrid(){
      const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
      const numDays = daysInMonth(viewYear, viewMonth);
      let html = '';
      for(let i=0; i<firstWeekday; i++) html += '<span class="cal-day empty"></span>';
      for(let d=1; d<=numDays; d++){
        const ds = dateStr(viewYear, viewMonth, d);
        const marked = !!marksByDate[ds];
        const isToday = viewYear===today.getFullYear() && viewMonth===today.getMonth() && d===today.getDate();
        html += `<button type="button" class="cal-day${marked?' marked':''}${isToday?' today':''}" data-date="${ds}">${d}</button>`;
      }
      calGrid.innerHTML = html;
    }

    calGrid.addEventListener('click', async (e) => {
      const btn = e.target.closest('.cal-day:not(.empty)');
      if(!btn) return;
      const ds = btn.dataset.date;
      const newState = !marksByDate[ds];
      marksByDate[ds] = newState;
      btn.classList.toggle('marked', newState);

      if(window.STTAuth.client){
        const { error } = await window.STTAuth.client
          .from('calendar_marks')
          .upsert({ user_id: user.id, mark_date: ds, marked: newState }, { onConflict: 'user_id,mark_date' });
        if(error){
          console.error('Failed to save calendar mark', error);
          // Revert on failure so the UI never claims a save that didn't happen.
          marksByDate[ds] = !newState;
          btn.classList.toggle('marked', !newState);
        }
      }
    });

    document.getElementById('calPrev').addEventListener('click', () => {
      viewMonth -= 1;
      if(viewMonth < 0){ viewMonth = 11; viewYear -= 1; }
      loadMonth();
    });
    document.getElementById('calNext').addEventListener('click', () => {
      viewMonth += 1;
      if(viewMonth > 11){ viewMonth = 0; viewYear += 1; }
      loadMonth();
    });

    loadMonth();
  }

  async function init(){
    // Nav sign-in/out state (top-right) is a separate concern from the
    // page's own content gating below — both need the same session check,
    // but only mountNavAuth() actually drives the "Sign in with Google"
    // button vs. the signed-in user chip. This was previously never
    // called on this page, so the nav never reflected real auth state.
    if(window.STTAuth) window.STTAuth.mountNavAuth();
    if(window.STTAuth) window.STTAuth.mountSidebar();
    if (window.STTTheme) window.STTTheme.mountToggle();

    if(!window.STTAuth || !window.STTAuth.isConfigured){
      showGate(
        'Sign-in isn\'t set up yet',
        'This Dashboard needs a Google sign-in provider configured before it can load your data. If you\'re the site owner, finish the Supabase setup steps, then this page will work.',
        false
      );
      return;
    }
    const session = await window.STTAuth.getSession();
    if(!session){
      showGate(
        'Sign in to see your Dashboard',
        'Your Daily Study Calendar and progress are tied to your Google account.',
        true
      );
      window.STTAuth.onAuthChange((s) => { if(s) location.reload(); });
      return;
    }
    gateMessage.style.display = 'none';
    renderDashboard(session);
  }

  init();
})();
</script>

</body>
</html>
