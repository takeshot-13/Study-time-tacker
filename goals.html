<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Set the theme before any CSS paints, so there's no flash of the
  // wrong theme. Mode is 'light' | 'dark' | 'system' (default 'system').
  // The full toggle logic and the live system-change listener live in
  // theme.js, loaded later.
  (function () {
    try {
      var mode = localStorage.getItem('stt-theme-mode') || 'system';
      var resolved = mode === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode;
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) { /* localStorage unavailable — default light theme applies */ }
  })();
</script>
<title>Goals & Progress — Study Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html{ overflow-x:hidden; }

  .goals-shell{
    max-width:840px;
    margin:0 auto;
    padding:44px 24px 60px;
  }

  .goals-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .goals-header h1{
    font-family:'Poppins', sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 6px;
  }
  .goals-header p{
    font-size:14px;
    color:var(--muted);
    margin:0;
    max-width:440px;
  }
  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--forest);
    color:#fff;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:22px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease;
  }
  .btn-primary:hover{ background:#324A2A; }
  .btn-secondary{
    background:none;
    border:1px solid var(--hair);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:9px 16px;
    border-radius:18px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .btn-secondary:hover{ color:var(--ink); border-color:var(--ink); }
  .btn-link{
    background:none;
    border:none;
    color:var(--forest);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    padding:0;
  }
  .btn-link:hover{ text-decoration:underline; }

  /* ---------- New goal form ---------- */
  .goal-form-card{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:24px;
    margin-bottom:28px;
  }
  .goal-form-card h2{
    font-family:'Poppins', sans-serif;
    font-size:16px;
    font-weight:700;
    margin:0 0 18px;
    color:var(--ink);
  }
  .form-field{
    display:block;
    margin-bottom:16px;
  }
  .form-field span{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
  }
  .form-field input[type="text"],
  .form-field input[type="date"]{
    width:100%;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--hair);
    border-radius:9px;
    padding:10px 12px;
  }
  .form-field input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .form-hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:5px;
  }

  .milestone-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
    align-items:center;
  }
  .milestone-row input[type="text"]{ flex:2; }
  .milestone-row input[type="date"]{ flex:1; }
  .milestone-remove-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:6px;
    flex-shrink:0;
  }
  .milestone-remove-btn:hover{ color:#9A3B2B; }
  .add-milestone-btn{
    margin-top:4px;
  }

  .form-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }

  /* ---------- Goal cards ---------- */
  .goals-list{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
    font-size:14px;
  }

  .goal-card{
    background:var(--surface);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:24px;
  }
  .goal-card-header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .goal-card-header h3{
    font-family:'Poppins', sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
    margin:0;
  }
  .goal-delete-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:13px;
    padding:4px 6px;
    border-radius:6px;
    flex-shrink:0;
  }
  .goal-delete-btn:hover{ color:#9A3B2B; background:var(--hover-bg); }

  .goal-meta{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    margin:10px 0 14px;
  }
  .goal-tag{
    background:var(--surface-2);
    color:var(--ink);
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:12px;
  }
  .goal-target{
    font-size:12px;
    color:var(--muted);
    margin-left:auto;
  }
  .goal-target.overdue{ color:#9A3B2B; font-weight:600; }

  .goal-progress-bar{
    height:8px;
    background:var(--surface-2);
    border-radius:5px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .goal-progress-fill{
    height:100%;
    background:var(--forest);
    border-radius:5px;
    transition:width .3s ease;
  }
  .goal-progress-label{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:18px;
  }

  .goal-section-title{
    font-family:'Poppins', sans-serif;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
  }

  .milestone-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 0;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
  }
  .milestone-item input[type="checkbox"]{
    width:16px; height:16px;
    accent-color:var(--forest);
    flex-shrink:0;
  }
  .milestone-item.done span.milestone-text{
    text-decoration:line-through;
    color:var(--muted);
  }
  .milestone-item .milestone-date{
    margin-left:auto;
    font-size:11px;
    color:var(--muted);
  }
  .milestones-block{ margin-bottom:20px; }

  .plan-block-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .plan-day{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-top:1px solid var(--hair);
    font-size:13px;
  }
  .plan-day:first-of-type{ border-top:none; }
  .plan-date{
    color:var(--muted);
    min-width:78px;
    flex-shrink:0;
  }
  .plan-subject{
    color:var(--ink);
    font-weight:600;
    flex:1;
  }
  .plan-log-btn{
    background:var(--surface-2);
    border:none;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11.5px;
    padding:6px 12px;
    border-radius:14px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, color .15s ease;
  }
  .plan-log-btn:hover{ background:var(--hover-bg); }
  .plan-log-btn.logged{
    background:#B7CBA6;
    color:#4C6B3A;
  }
  .plan-empty{
    font-size:12.5px;
    color:var(--muted);
    padding:8px 0;
  }
  .plan-note{
    font-size:11px;
    color:var(--muted);
    margin-top:10px;
  }

  @media (max-width:700px){
    .goals-shell{ padding:28px 16px 40px; }
    .goals-header h1{ font-size:21px; }
    .goal-card, .goal-form-card{ padding:18px; }
    .goal-target{ margin-left:0; width:100%; }
    .milestone-row{ flex-wrap:wrap; }
    .milestone-row input[type="text"], .milestone-row input[type="date"]{ flex:1 1 100%; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <button class="menu-toggle-btn" id="menuToggle" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a href="index.html" class="site-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c-3 0-5.5 2.2-5.5 5.2 0 1.7.8 2.8 1.7 3.7.7.7 1.1 1.4 1.1 2.3v1.3h5.4v-1.3c0-.9.4-1.6 1.1-2.3.9-.9 1.7-2 1.7-3.7C17.5 6.2 15 4 12 4Z"/><path d="M9.7 19.5h4.6M10.3 21.5h3.4"/></svg>
      Study Time Tracker
    </a>
  </div>
  <nav class="site-nav">
    <button class="nav-signin-btn" id="navSignIn">
      <svg viewBox="0 0 18 18" width="14" height="14"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <div class="nav-user-chip" id="navUserChip">
      <img id="navUserAvatar" alt="">
      <span class="nav-user-name" id="navUserName"></span>
      <button class="nav-signout-btn" id="navSignOut">Sign out</button>
    </div>
  </nav>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="side-drawer" id="sideDrawer">
  <div class="side-drawer-header">
    <span class="side-drawer-title">Menu</span>
    <button class="side-drawer-close" id="sideDrawerClose" aria-label="Close menu">&#10005;</button>
  </div>
  <nav class="side-drawer-nav">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="study-time-tracker.html">Study Time Tracker</a>
    <a href="goals.html">Goals &amp; Progress</a>
    <!-- Additional pages can be added here later -->
  </nav>
  <div class="side-drawer-footer">
    <div class="theme-mode-group" role="group" aria-label="Theme">
      <button class="theme-mode-btn" data-mode="light" type="button" aria-label="Light theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Light</span>
      </button>
      <button class="theme-mode-btn" data-mode="dark" type="button" aria-label="Dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <span>Dark</span>
      </button>
      <button class="theme-mode-btn" data-mode="system" type="button" aria-label="Match system theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Auto</span>
      </button>
    </div>
  </div>
</aside>

<main class="goals-shell">

  <div class="goals-header">
    <div>
      <h1>Goals &amp; Progress</h1>
      <p>Set a target date and subjects, break it into milestones, and get a simple weekly study plan.</p>
    </div>
    <button class="btn-primary" id="newGoalBtn" type="button">+ New Goal</button>
  </div>

  <div class="goal-form-card" id="goalFormCard" hidden>
    <h2>New Study Goal</h2>

    <label class="form-field">
      <span>Goal title</span>
      <input type="text" id="goalTitle" placeholder="e.g. Ace the Biology Midterm">
    </label>

    <label class="form-field">
      <span>Target date</span>
      <input type="date" id="goalTargetDate">
    </label>

    <label class="form-field">
      <span>Subjects</span>
      <input type="text" id="goalSubjects" placeholder="e.g. Cell Biology, Genetics, Ecology">
      <span class="form-hint">Comma-separated. The weekly plan cycles through these.</span>
    </label>

    <div class="form-field">
      <span>Milestones</span>
      <div id="milestoneRows"></div>
      <button type="button" class="btn-link add-milestone-btn" id="addMilestoneBtn">+ Add milestone</button>
    </div>

    <div class="form-actions">
      <button class="btn-primary" id="saveGoalBtn" type="button">Save Goal</button>
      <button class="btn-secondary" id="cancelGoalBtn" type="button">Cancel</button>
    </div>
  </div>

  <div class="goals-list" id="goalsList"></div>

</main>

<footer class="site-footer">© Study Time Tracker</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="goals.js"></script>
<script>
  if (window.STTAuth) window.STTAuth.mountNavAuth();
  if (window.STTAuth) window.STTAuth.mountSidebar();
  if (window.STTTheme) window.STTTheme.mountToggle();
  if (window.STTGoals) window.STTGoals.init();
</script>

</body>
</html>
